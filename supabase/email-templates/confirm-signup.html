<h2>Welcome to FitLeague</h2>
<p>Tap the button to sign in on this device:</p>
<p>
  <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email"
     style="display:inline-block;padding:12px 20px;background:#C2410C;color:#fff;border-radius:10px;text-decoration:none;font-weight:600">
    Sign in to FitLeague
  </a>
</p>
<p>Or type this code on the sign-in screen (works on any device, and in the home-screen app):</p>
<p style="font-size:28px;font-weight:700;letter-spacing:6px">{{ .Token }}</p>
<p style="color:#6B7280;font-size:13px">The link and code work once and expire in an hour. If you didn’t ask for this, ignore this email.</p>
